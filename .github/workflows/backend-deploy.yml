# =============================================================================
# backend-deploy.yml — CI/CD pour authentification-symfony
# =============================================================================
# Build et push les images Docker (backend Symfony + frontend Nuxt),
# synchronise les fichiers deploy/ sur le serveur, puis déploie via SSH.
#
# Architecture :
#   - api.auth.bachelart.fr → backend Symfony (port 80)
#   - auth.bachelart.fr     → frontend Nuxt (port 3000)
#
# Référence : docs/guide-deploiement-projets-externes.md §6
# =============================================================================

name: Build and Deploy

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'backend/deploy/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ${{ secrets.REGISTRY_HOST }}
  PROJECT_NAME: authentification-symfony

jobs:
  # ── Build backend ──────────────────────────────────────────────────────────
  build-backend:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.PROJECT_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.PROJECT_NAME }}:latest-${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}

  # ── Build frontend ─────────────────────────────────────────────────────────
  build-frontend:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          platforms: linux/arm64
          build-args: |
            NUXT_PUBLIC_API_BASE=https://api.auth-staging.bachelart.fr
          tags: |
            ${{ env.REGISTRY }}/${{ env.PROJECT_NAME }}-frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.PROJECT_NAME }}-frontend:latest-${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}

  # ── Deploy staging ─────────────────────────────────────────────────────────
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: |
      github.ref == 'refs/heads/develop' &&
      needs.build-backend.result == 'success' &&
      needs.build-frontend.result == 'success'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_SSH_KEY }}" | base64 -d > ~/.ssh/oracle
          chmod 600 ~/.ssh/oracle
          cat >> ~/.ssh/config <<EOF
          Host oracle
            HostName ${{ secrets.ORACLE_HOST }}
            User ${{ secrets.ORACLE_SSH_USER }}
            IdentityFile ~/.ssh/oracle
            StrictHostKeyChecking accept-new
          EOF

      - name: Sync deploy files to server
        run: |
          rsync -avz --delete --exclude='.env.*' -e "ssh" \
            backend/deploy/ \
            oracle:/home/deploy/${{ env.PROJECT_NAME }}/deploy/

      - name: Deploy via SSH
        run: |
          ssh oracle "bash /home/deploy/${{ env.PROJECT_NAME }}/deploy/scripts/deploy.sh staging ${{ github.sha }}"

  # ── Deploy production ──────────────────────────────────────────────────────
  deploy-prod:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, deploy-staging]
    if: |
      github.ref == 'refs/heads/main' && always() &&
      needs.build-backend.result == 'success' &&
      needs.build-frontend.result == 'success' &&
      (needs.deploy-staging.result == 'success' || needs.deploy-staging.result == 'skipped')
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_SSH_KEY }}" | base64 -d > ~/.ssh/oracle
          chmod 600 ~/.ssh/oracle
          cat >> ~/.ssh/config <<EOF
          Host oracle
            HostName ${{ secrets.ORACLE_HOST }}
            User ${{ secrets.ORACLE_SSH_USER }}
            IdentityFile ~/.ssh/oracle
            StrictHostKeyChecking accept-new
          EOF

      - name: Sync deploy files to server
        run: |
          rsync -avz --delete --exclude='.env.*' -e "ssh" \
            backend/deploy/ \
            oracle:/home/deploy/${{ env.PROJECT_NAME }}/deploy/

      - name: Deploy via SSH
        run: |
          ssh oracle "bash /home/deploy/${{ env.PROJECT_NAME }}/deploy/scripts/deploy.sh prod ${{ github.sha }}"