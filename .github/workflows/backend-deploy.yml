# =============================================================================
# backend-deploy.yml — CI/CD pour authentification-symfony
# =============================================================================
# Build et push les images Docker (backend Symfony + frontend Nuxt),
# puis déploie sur le VPS via SSH gate (ci-gate) en staging ou production.
#
# Architecture :
#   - api.auth.bachelart.fr → backend Symfony (port 80)
#   - auth.bachelart.fr     → frontend Nuxt (port 3000)
#
# Workflow :
#   develop → build backend + frontend → deploy staging
#   main    → build backend + frontend → deploy staging → deploy prod
#
# Dépendances serveur :
#   - ci-gate.sh (forced command SSH) : reçoit "deploy authentification-symfony <env> <sha>"
#   - deploy/scripts/deploy.sh : orchestrateur docker compose up côté serveur
#   - deploy/docker-compose.prod.yml : config docker compose (backend + frontend)
#
# Secrets GitHub requis :
#   REGISTRY_HOST    — registry.bachelart.fr
#   REGISTRY_USER    — utilisateur htpasswd
#   REGISTRY_PASSWORD — mot de passe htpasswd
#   ORACLE_HOST      — IP ou domaine du VPS
#   ORACLE_SSH_USER  — deploy
#   ORACLE_SSH_KEY   — clé privée CI (contenu complet, pas .pub)
# =============================================================================

name: Build and Deploy

# ── Déclencheurs ─────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'backend/**'
      - 'backend/Dockerfile'
      - 'backend/composer.json'
      - 'backend/composer.lock'
      - 'backend/deploy/**'
      - 'frontend/**'

  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild and redeploy'
        required: false
        type: boolean
        default: false
      debug_ssh:
        description: 'Enable verbose SSH debug output'
        required: false
        type: boolean
        default: false

# ── Permissions et concurrence ───────────────────────────────────────────────
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ── Variables d'environnement ────────────────────────────────────────────────
env:
  REGISTRY: ${{ secrets.REGISTRY_HOST }}
  PROJECT_NAME: authentification-symfony

jobs:
  # ============================================================================
  # JOB 1 : build-backend
  # ----------------------------------------------------------------------------
  # Build et push l'image Docker Symfony (target: php).
  # Tags : SHA + latest-staging / latest-prod
  # ============================================================================
  build-backend:
    name: Build backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: php
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.PROJECT_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.PROJECT_NAME }}:latest-${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # JOB 2 : build-frontend
  # ----------------------------------------------------------------------------
  # Build et push l'image Docker Nuxt.
  # L'argument NUXT_PUBLIC_API_BASE définit la cible du proxy Nitro
  # pour les appels /api/* et /oauth2/*.
  # Tags : SHA + latest-staging / latest-prod
  # ============================================================================
  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          platforms: linux/arm64
          build-args: |
            NUXT_PUBLIC_API_BASE=https://api.auth.bachelart.fr
          tags: |
            ${{ env.REGISTRY }}/${{ env.PROJECT_NAME }}-frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.PROJECT_NAME }}-frontend:latest-${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # JOB 3 : deploy-staging
  # ----------------------------------------------------------------------------
  # Déploie sur l'environnement de staging.
  # Conditions : branche develop, builds backend ET frontend réussis
  # ============================================================================
  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/develop' && (always() && needs.build-backend.result == 'success' && needs.build-frontend.result == 'success')
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/oracle
          chmod 600 ~/.ssh/oracle
          cat >> ~/.ssh/config <<EOF
          Host oracle
            HostName ${{ secrets.ORACLE_HOST }}
            User ${{ secrets.ORACLE_SSH_USER }}
            IdentityFile ~/.ssh/oracle
            StrictHostKeyChecking accept-new
            UpdateHostKeys no
          EOF

      - name: Debug SSH
        if: ${{ inputs.debug_ssh || false }}
        run: ssh -vvv -o BatchMode=yes -o ConnectTimeout=10 oracle ping || true

      - name: Sync deploy files
        env:
          SSH_VERBOSE: ${{ inputs.debug_ssh && '-vvv' || '' }}
        run: |
          rsync -avz --delete \
            --exclude='.env.*' \
            --exclude='acme.json' \
            --exclude='htpasswd' \
            -e "ssh $SSH_VERBOSE" \
            backend/deploy/ oracle:/home/deploy/${{ env.PROJECT_NAME }}/deploy/

      - name: Deploy
        env:
          SSH_VERBOSE: ${{ inputs.debug_ssh && '-vvv' || '' }}
        run: ssh $SSH_VERBOSE oracle "deploy ${{ env.PROJECT_NAME }} staging ${{ github.sha }}"

  # ============================================================================
  # JOB 4 : deploy-prod
  # ----------------------------------------------------------------------------
  # Déploie en production, uniquement si staging a réussi.
  # Conditions : branche main, builds réussis, staging réussi ou skip
  # ============================================================================
  deploy-prod:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, deploy-staging]
    if: |
      github.ref == 'refs/heads/main' &&
      always() &&
      needs.build-backend.result == 'success' &&
      needs.build-frontend.result == 'success' &&
      (needs.deploy-staging.result == 'success' || needs.deploy-staging.result == 'skipped')
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/oracle
          chmod 600 ~/.ssh/oracle
          cat >> ~/.ssh/config <<EOF
          Host oracle
            HostName ${{ secrets.ORACLE_HOST }}
            User ${{ secrets.ORACLE_SSH_USER }}
            IdentityFile ~/.ssh/oracle
            StrictHostKeyChecking accept-new
            UpdateHostKeys no
          EOF

      - name: Debug SSH
        if: ${{ inputs.debug_ssh || false }}
        run: ssh -vvv -o BatchMode=yes -o ConnectTimeout=10 oracle ping || true

      - name: Sync deploy files
        env:
          SSH_VERBOSE: ${{ inputs.debug_ssh && '-vvv' || '' }}
        run: |
          rsync -avz --delete \
            --exclude='.env.*' \
            --exclude='acme.json' \
            --exclude='htpasswd' \
            -e "ssh $SSH_VERBOSE" \
            backend/deploy/ oracle:/home/deploy/${{ env.PROJECT_NAME }}/deploy/

      - name: Deploy
        env:
          SSH_VERBOSE: ${{ inputs.debug_ssh && '-vvv' || '' }}
        run: ssh $SSH_VERBOSE oracle "deploy ${{ env.PROJECT_NAME }} prod ${{ github.sha }}"