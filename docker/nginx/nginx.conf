# =============================================================================
# nginx.conf — Reverse proxy pour développement local
# =============================================================================
# Point d'entrée unique sur le port 80.
#
# Routage :
#   /api/*       → backend Symfony (PHP built-in server)
#   /oauth2/*    → backend Symfony (PHP built-in server)
#   /bundles/*   → backend Symfony (assets)
#   /*           → frontend Nuxt (dev server)
# =============================================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Format de log structuré
    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"upstream":"$upstream_addr"'
    '}';

    access_log /dev/stdout json;
    error_log /dev/stderr warn;

    server {
        listen 80;
        server_name _;

        # ── Backend Symfony ──────────────────────────────────────────
        location /api/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /oauth2/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /bundles/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Frontend Nuxt ────────────────────────────────────────────
        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts longs pour le HMR (Hot Module Replacement)
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}